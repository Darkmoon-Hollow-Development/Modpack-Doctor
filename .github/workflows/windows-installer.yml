name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build program
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean ModpackDoctor.spec
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "import modpack_doctor; print(modpack_doctor.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\ModpackDoctor.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ModpackDoctor-Setup
          path: dist/ModpackDoctor-Setup-*.exe
