[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modpack-doctor"
version = "4.1"
description = "Find mod incompatibilities, missing dependencies and config problems in Minecraft modpacks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.scripts]
modpack-doctor = "modpack_doctor.cli:main"

[project.gui-scripts]
modpack-doctor-gui = "modpack_doctor.gui:main"

[tool.setuptools]
packages = ["modpack_doctor"]

[tool.setuptools.package-data]
modpack_doctor = ["data/*.json", "data/*.png"]
